<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playback Media Player Pro</title>
  
  <!-- Tailwind CSS CDN & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body class="h-full text-slate-100 font-sans antialiased selection:bg-blue-600 selection:text-white relative overflow-x-hidden">

  <!-- Background Personalizável -->
  <div id="appBg" class="fixed inset-0 bg-cover bg-center filter blur-lg scale-105 opacity-40 transition-all duration-500 -z-10"></div>
  <div class="fixed inset-0 bg-gradient-to-b from-slate-950/80 via-slate-950/90 to-slate-950 -z-10"></div>

  <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 flex flex-col gap-6 min-h-full">

    <!-- CABEÇALHO -->
    <header class="flex flex-col sm:flex-row justify-between items-center gap-4 p-4 sm:p-6 bg-slate-900/60 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-xl">
      <div class="flex items-center gap-3">
        <div class="p-3 bg-blue-600/20 border border-blue-500/30 rounded-xl text-blue-400">
          <i data-lucide="disc-3" class="w-8 h-8 animate-spin-slow"></i>
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-black tracking-tight text-white">Playback Pro</h1>
          <p class="text-xs text-slate-400">Player Multimídia Otimizado (Persistente)</p>
        </div>
      </div>

      <div class="flex items-center gap-3 w-full sm:w-auto">
        <label for="themeInput" class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-4 py-2.5 bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700 rounded-xl text-sm font-semibold cursor-pointer transition">
          <i data-lucide="palette" class="w-4 h-4 text-slate-300"></i>
          <span>Mudar Tema</span>
        </label>
        <input type="file" id="themeInput" accept="image/*" class="hidden">

        <label for="mediaInput" class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-semibold cursor-pointer shadow-lg shadow-blue-600/25 transition">
          <i data-lucide="folder-plus" class="w-4 h-4"></i>
          <span>Abrir Galeria</span>
        </label>
        <input type="file" id="mediaInput" accept="video/*,image/*" multiple class="hidden">
      </div>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <main class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

      <!-- PALCO DE REPRODUÇÃO -->
      <section id="playerWrapper" class="lg:col-span-7 flex flex-col gap-4 p-4 sm:p-6 bg-slate-900/60 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-xl transition-all duration-300">
        
        <!-- Topo do Player -->
        <div class="flex items-center justify-between gap-4">
          <div class="flex items-center gap-2 text-sm font-semibold text-slate-200 truncate">
            <i data-lucide="play-circle" id="mediaTypeIcon" class="w-5 h-5 text-blue-400 flex-shrink-0"></i>
            <span id="currentTitle" class="truncate">Carregando dados salvos...</span>
          </div>

          <div class="flex items-center gap-2 flex-shrink-0">
            <button id="btnMiniPlayer" type="button" class="p-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded-lg transition" title="Minimizar (Flutuante)">
              <i data-lucide="minimize-2" id="miniIcon" class="w-4 h-4"></i>
            </button>
            <button id="btnFullscreen" type="button" class="p-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded-lg transition" title="Tela Cheia">
              <i data-lucide="maximize" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Tela de Exibição -->
        <div id="displayArea" class="relative w-full aspect-video bg-black rounded-xl overflow-hidden flex items-center justify-center border border-slate-800 shadow-inner group">
          <video id="videoPlayer" class="w-full h-full object-contain" playsinline></video>
          <img id="imageViewer" class="max-w-full max-h-full object-contain transition-transform duration-300 hidden" alt="Foto Selecionada">

          <!-- Estado Vazio -->
          <div id="emptyState" class="flex flex-col items-center justify-center gap-3 p-6 text-center text-slate-500">
            <i data-lucide="clapperboard" class="w-12 h-12 text-slate-600"></i>
            <p class="text-sm font-medium">Sua galeria está vazia.<br>Adicione vídeos ou fotos para salvar localmente.</p>
          </div>

          <!-- Rotação de Fotos -->
          <div id="photoControls" class="absolute bottom-4 left-1/2 -translate-x-1/2 hidden items-center gap-2 px-4 py-2 bg-slate-900/90 backdrop-blur-md border border-slate-700 rounded-full shadow-2xl z-10">
            <button id="btnRotateCcw" type="button" class="p-2 hover:bg-slate-800 text-slate-300 rounded-full transition" title="-90°">
              <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>
            <button id="btnResetRotate" type="button" class="p-2 hover:bg-slate-800 text-slate-300 rounded-full transition" title="Resetar">
              <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            </button>
            <button id="btnRotateCw" type="button" class="p-2 hover:bg-slate-800 text-slate-300 rounded-full transition" title="+90°">
              <i data-lucide="rotate-cw" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Barra de Volume Dedicada -->
        <div class="flex items-center gap-3 px-4 py-3 bg-slate-950/60 border border-slate-800/80 rounded-xl">
          <button id="btnMute" type="button" class="text-blue-400 hover:text-blue-300 transition">
            <i data-lucide="volume-2" id="volIcon" class="w-5 h-5"></i>
          </button>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" class="flex-1 accent-blue-500 h-1.5 bg-slate-800 rounded-lg cursor-pointer">
          <span id="volPercentage" class="text-xs font-bold text-slate-400 w-10 text-right">100%</span>
        </div>

        <!-- Progresso e Controles -->
        <div class="flex flex-col gap-3">
          <div class="flex items-center gap-3 text-xs font-semibold text-slate-400">
            <span id="currentTime">00:00</span>
            <div id="progressBarBg" class="flex-1 h-2 bg-slate-800 rounded-full cursor-pointer relative overflow-hidden">
              <div id="progressBarFill" class="h-full bg-blue-500 rounded-full w-0 transition-all duration-75"></div>
            </div>
            <span id="durationTime">00:00</span>
          </div>

          <div class="flex items-center justify-center gap-4 pt-2">
            <button id="btnPrev" type="button" class="p-3 bg-slate-800/80 hover:bg-slate-700 text-slate-200 rounded-full transition">
              <i data-lucide="skip-back" class="w-5 h-5"></i>
            </button>
            
            <button id="btnPlayPause" type="button" class="p-4 bg-blue-600 hover:bg-blue-500 text-white rounded-full shadow-lg shadow-blue-600/30 transition transform hover:scale-105">
              <i data-lucide="play" id="playIcon" class="w-6 h-6"></i>
            </button>

            <button id="btnNext" type="button" class="p-3 bg-slate-800/80 hover:bg-slate-700 text-slate-200 rounded-full transition">
              <i data-lucide="skip-forward" class="w-5 h-5"></i>
            </button>
          </div>
        </div>

      </section>

      <!-- SEÇÃO DA PLAYLIST / GALERIA -->
      <section class="lg:col-span-5 flex flex-col gap-4 p-4 sm:p-6 bg-slate-900/60 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-xl max-h-[600px]">
        <div class="flex items-center justify-between pb-3 border-b border-slate-800">
          <div class="flex items-center gap-2">
            <i data-lucide="list-music" class="w-5 h-5 text-blue-400"></i>
            <h2 class="text-base font-bold text-white">Sua Galeria (<span id="mediaCount">0</span>)</h2>
          </div>
          <button id="btnClearPlaylist" type="button" class="text-xs font-semibold text-red-400 hover:text-red-300 flex items-center gap-1 transition">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            <span>Limpar Salvos</span>
          </button>
        </div>

        <div id="mediaList" class="flex flex-col gap-2 overflow-y-auto pr-1">
          <!-- Itens injetados dinamicamente via JS -->
        </div>
      </section>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
